wake:
  fields:
    device_id:
      selector:
        device:
          integration: pine3_wall
          multiple: true
    seconds:
      default: 60
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: s
show_page:
  fields:
    device_id:
      selector:
        device:
          integration: pine3_wall
          multiple: true
    page:
      required: true
      example: "room/sala"
      selector:
        text:
show_camera:
  fields:
    device_id:
      selector:
        device:
          integration: pine3_wall
          multiple: true
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    seconds:
      default: 120
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
notify:
  fields:
    device_id:
      selector:
        device:
          integration: pine3_wall
          multiple: true
    title:
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    seconds:
      default: 30
      selector:
        number:
          min: 3
          max: 3600
          unit_of_measurement: s
    wake:
      default: true
      selector:
        boolean:
screensaver:
  fields:
    device_id:
      selector:
        device:
          integration: pine3_wall
          multiple: true
    "on":
      required: true
      selector:
        boolean:
