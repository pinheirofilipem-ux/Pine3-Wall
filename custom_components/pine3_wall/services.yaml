wake:
  target:
    device:
      integration: pine3_wall
  fields:
    seconds:
      default: 60
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: s
show_page:
  target:
    device:
      integration: pine3_wall
  fields:
    page:
      required: true
      example: "room/sala"
      selector:
        text:
show_camera:
  target:
    device:
      integration: pine3_wall
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    seconds:
      default: 120
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
notify:
  target:
    device:
      integration: pine3_wall
  fields:
    title:
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    seconds:
      default: 30
      selector:
        number:
          min: 3
          max: 3600
          unit_of_measurement: s
    wake:
      default: true
      selector:
        boolean:
screensaver:
  target:
    device:
      integration: pine3_wall
  fields:
    "on":
      required: true
      selector:
        boolean:
